<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0d12;
    --surface:   #10141b;
    --surface-2: #151a22;
    --line:      #1f2630;
    --line-2:    #2a3340;
    --text:      #e6edf3;
    --muted:     #7d8794;
    --dim:       #4b5563;
    --accent:    #22d3ee;
    --accent-bg: rgba(34, 211, 238, 0.08);
    --ok:        #4ade80;
    --radius:    8px;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --header-h: 60px;
  }

  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  svg { display: block; flex-shrink: 0; }

  /* ─── HEADER ─── */
  header {
    position: sticky; top: 0; z-index: 50;
    height: var(--header-h);
    background: rgba(10, 13, 18, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1180px; height: 100%;
    margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; gap: 24px;
  }
  .logo {
    font-family: var(--mono); font-weight: 500; font-size: 0.95rem;
    letter-spacing: 0.08em; white-space: nowrap;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 8px; height: 8px; border-radius: 2px;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
  }
  .logo span { color: var(--muted); font-weight: 400; }

  .search {
    flex: 1; max-width: 520px; position: relative;
  }
  .search svg.ico {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .search input {
    width: 100%; height: 36px;
    padding: 0 64px 0 36px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); background: var(--surface-2); }
  .search input::-webkit-search-cancel-button { display: none; }
  .kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    border: 1px solid var(--line-2); border-radius: 4px;
    padding: 1px 6px; pointer-events: none;
  }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 4px;
    display: none; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .search-clear:hover { color: var(--text); background: var(--line); }
  .search.has-value .kbd { display: none; }
  .search.has-value .search-clear { display: flex; }

  .count {
    margin-left: auto;
    font-family: var(--mono); font-size: 0.75rem; color: var(--muted);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--text); font-weight: 500; }

  /* ─── LAYOUT ─── */
  .layout {
    max-width: 1180px; margin: 0 auto;
    padding: 28px 24px 64px;
    display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px;
  }

  /* ─── SIDEBAR ─── */
  aside { position: sticky; top: calc(var(--header-h) + 28px); align-self: start; }
  .side-title {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim);
    padding: 0 10px 10px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-radius: 6px;
    color: var(--muted); font-size: 0.85rem;
    transition: color .12s, background .12s;
  }
  .nav a:hover { color: var(--text); background: var(--surface); }
  .nav a.active { color: var(--accent); background: var(--accent-bg); }
  .nav a.empty { opacity: .35; pointer-events: none; }
  .nav .n {
    font-family: var(--mono); font-size: 0.7rem; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .nav a.active .n { color: var(--accent); }

  /* ─── SECTIONS ─── */
  .section + .section { margin-top: 32px; }
  .section-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 0 2px 10px;
  }
  .section-head h2 {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .section-head .n { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); }
  .section-head::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }

  .list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  /* ─── ROW ─── */
  .row {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    align-items: center; gap: 14px;
    padding: 11px 14px;
    transition: background .1s;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--surface-2); }

  .avatar {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: 1px solid var(--line-2);
    font-family: var(--mono); font-size: 0.72rem; font-weight: 500;
    color: var(--muted); letter-spacing: 0.02em;
  }
  .row:hover .avatar { color: var(--accent); border-color: rgba(34,211,238,.35); }

  .info { min-width: 0; }
  .name {
    font-weight: 500; font-size: 0.9rem;
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap; overflow: hidden;
  }
  .name .t { overflow: hidden; text-overflow: ellipsis; }
  .desc {
    color: var(--muted); font-size: 0.8rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    font-family: var(--mono); font-size: 0.62rem; font-weight: 500;
    letter-spacing: 0.06em;
    padding: 1px 6px; border-radius: 4px;
    color: var(--muted); border: 1px solid var(--line-2);
    flex-shrink: 0;
  }
  .badge.web { color: #a78bfa; border-color: rgba(167,139,250,.3); }

  mark { background: rgba(34,211,238,.18); color: var(--accent); border-radius: 2px; }

  /* ─── ACTIONS ─── */
  .actions { display: flex; align-items: center; gap: 6px; }
  .btn {
    height: 32px; padding: 0 12px;
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 6px; font-size: 0.8rem; font-weight: 500;
    white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn-primary {
    background: var(--accent-bg); color: var(--accent);
    border: 1px solid rgba(34,211,238,.25);
  }
  .btn-primary:hover { background: var(--accent); color: #031317; border-color: var(--accent); }
  .btn-icon {
    width: 32px; padding: 0; justify-content: center;
    color: var(--muted); border: 1px solid var(--line-2);
  }
  .btn-icon:hover { color: var(--text); border-color: var(--muted); }
  .btn-icon.ok { color: var(--ok); border-color: var(--ok); }
  .btn:focus-visible, .nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ─── EMPTY ─── */
  .empty {
    display: none; text-align: center;
    padding: 72px 20px; color: var(--muted);
    border: 1px dashed var(--line-2); border-radius: 10px;
  }
  .empty.show { display: block; }
  .empty strong { display: block; color: var(--text); font-weight: 500; margin-bottom: 4px; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 100;
    transform: translate(-50%, 12px); opacity: 0;
    background: var(--surface-2); border: 1px solid var(--line-2);
    color: var(--text); font-size: 0.82rem;
    padding: 9px 14px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    transition: opacity .18s, transform .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast svg { color: var(--ok); }

  footer {
    border-top: 1px solid var(--line);
    padding: 18px 24px;
    text-align: center;
    font-family: var(--mono); font-size: 0.7rem; color: var(--dim);
    letter-spacing: 0.06em;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 16px; }
    aside {
      position: sticky; top: var(--header-h); z-index: 40;
      margin: 0 -24px; padding: 10px 24px;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .side-title { display: none; }
    .nav { flex-direction: row; overflow-x: auto; gap: 6px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { flex-shrink: 0; border: 1px solid var(--line); padding: 5px 10px; }
    html { scroll-padding-top: calc(var(--header-h) + 64px); }
  }
  @media (max-width: 600px) {
    .header-inner { padding: 0 16px; gap: 12px; }
    .layout { padding: 16px 16px 48px; }
    aside { margin: 0 -16px; padding: 10px 16px; }
    .logo span, .count, .kbd { display: none; }
    .btn-primary .lbl { display: none; }
    .btn-primary { width: 32px; padding: 0; justify-content: center; }
    .row { gap: 12px; padding: 10px 12px; }
  }
</style>
</head>

const catRank = c => { const i = CAT_ORDER.indexOf(c); return i === -1 ? 999 : i; };
const CATS = [...new Set(SOFTWARE.map(s => s.cat))]
  .sort((a, b) => catRank(a) - catRank(b) || a.localeCompare(b, 'fr'));

SOFTWARE.forEach(s => {
  s._search = norm(`${s.name} ${s.desc} ${s.cat}`);
  const m = s.url.match(/\.(exe|msi|img|iso|zip)(?=$|[?#])/i);
  s._type = s.isLink ? 'WEB' : (m ? m[1].toUpperCase() : 'DL');
  s._initials = s.name.replace(/[—-].*$/, '').trim().split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
});

/* Surligne la recherche (insensible aux accents) */
function highlight(text, q) {
  if (!q) return esc(text);
  const n = norm(text), i = n.indexOf(q);
  if (i === -1) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function rowHTML(s, q) {
  const action = s.isLink
    ? `<a class="btn btn-primary" href="${esc(s.url)}" target="_blank" rel="noopener">${ICON.ext}<span class="lbl">Ouvrir</span></a>`
    : `<a class="btn btn-primary" href="${esc(s.url)}" target="_blank" rel="noopener" download>${ICON.dl}<span class="lbl">Télécharger</span></a>`;
  return `
    <div class="row">
      <div class="avatar">${esc(s._initials)}</div>
      <div class="info">
        <div class="name"><span class="t">${highlight(s.name, q)}</span><span class="badge${s.isLink ? ' web' : ''}">${s._type}</span></div>
        <div class="desc">${highlight(s.desc, q)}</div>
      </div>
      <div class="actions">
        ${action}
        <button class="btn btn-icon" data-copy="${esc(s.url)}" title="Copier le lien" aria-label="Copier le lien de ${esc(s.name)}">${ICON.copy}</button>
      </div>
    </div>`;
}

function render() {
  const q = norm(els.search.value.trim());
  const items = q ? SOFTWARE.filter(s => s._search.includes(q)) : SOFTWARE;

  const groups = {};
  CATS.forEach(c => groups[c] = []);
  items.forEach(s => groups[s.cat].push(s));
  Object.values(groups).forEach(g => g.sort((a, b) => a.name.localeCompare(b.name, 'fr')));

  els.list.innerHTML = CATS.filter(c => groups[c].length).map(c => `
    <section class="section" id="${slug(c)}">
      <div class="section-head"><h2>${esc(c)}</h2><span class="n">${groups[c].length}</span></div>
      <div class="list">${groups[c].map(s => rowHTML(s, q)).join('')}</div>
    </section>`).join('');

  els.nav.innerHTML = CATS.map(c => `
    <a href="#${slug(c)}" data-cat="${slug(c)}" class="${groups[c].length ? '' : 'empty'}">
      <span>${esc(c)}</span><span class="n">${groups[c].length}</span>
    </a>`).join('');

  els.empty.classList.toggle('show', items.length === 0);
  els.wrap.classList.toggle('has-value', !!els.search.value);
  els.count.innerHTML = `<b>${items.length}</b> / ${SOFTWARE.length} éléments`;
  observeSections();
}

/* Copier le lien */
let toastTimer;
function toast(msg) {
  els.toastMsg.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1600);
}
els.list.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  navigator.clipboard.writeText(btn.dataset.copy).then(() => {
    btn.classList.add('ok'); btn.innerHTML = ICON.ok;
    toast('Lien copié dans le presse-papier');
    setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = ICON.copy; }, 1600);
  }).catch(() => toast('Copie impossible'));
});

/* Catégorie active au scroll */
let observer;
function observeSections() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      els.nav.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.cat === en.target.id));
      const active = els.nav.querySelector('a.active');
      if (active && window.innerWidth <= 860) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    });
  }, { rootMargin: '-120px 0px -65% 0px' });
  document.querySelectorAll('.section').forEach(s => observer.observe(s));
}

/* Recherche + raccourcis clavier */
els.search.addEventListener('input', render);
els.clear.addEventListener('click', () => { els.search.value = ''; render(); els.search.focus(); });

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== els.search) {
    e.preventDefault(); els.search.focus(); els.search.select();
  } else if (e.key === 'Escape' && document.activeElement === els.search) {
    els.search.value = ''; render(); els.search.blur();
  } else if (e.key === 'Enter' && document.activeElement === els.search) {
    const first = els.list.querySelector('.btn-primary');
    if (first) first.click();
  }
});

render();
</script>
</body>
</html>
