<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SI-ONE — Portail Téléchargements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --line:    #21262d;
    --accent:  #06b6d4;
    --accent2: #3b82f6;
    --text:    #e6edf3;
    --muted:   #7d8590;
    --hover:   #1c2128;
    --btn-dl:  #0891b2;
    --btn-cp:  #21262d;
    --radius:  6px;
    --mono:    'JetBrains Mono', monospace;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-logo {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .search-box {
    flex: 1;
    max-width: 480px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 7px 12px 7px 34px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }

  .search-box svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .topbar-count {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ─── MAIN ─── */
  main {
    flex: 1;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }

  /* ─── CATEGORY LABEL ─── */
  .cat-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 20px 0 8px;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }
  .cat-label:first-child { border-top: none; margin-top: 0; padding-top: 4px; }

  /* ─── ROW ─── */
  .dl-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 10px;
    border-radius: var(--radius);
    transition: background 0.1s;
    position: relative;
  }
  .dl-row:hover { background: var(--hover); }

  .dl-name {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dl-desc {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }

  /* ─── BUTTONS ─── */
  .btn-dl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: var(--btn-dl);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-dl:hover { background: #0e7490; transform: translateY(-1px); }
  .btn-dl:active { transform: translateY(0); }

  .btn-copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--btn-cp);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    position: relative;
  }
  .btn-copy:hover { background: var(--hover); color: var(--accent); border-color: var(--accent); }
  .btn-copy.copied { color: #4ade80; border-color: #4ade80; }

  /* Tooltip */
  .btn-copy::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    right: 0;
    background: #1e293b;
    color: var(--text);
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    border: 1px solid var(--line);
  }
  .btn-copy:hover::after { opacity: 1; }

  /* ─── EMPTY STATE ─── */
  .empty {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 0.9rem;
  }
  .empty.show { display: block; }

  /* ─── DIVIDER ─── */
  .row-divider {
    height: 1px;
    background: var(--line);
    margin: 0 10px;
    opacity: 0.5;
  }

  /* ─── FOOTER ─── */
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .dl-desc { display: none; }
    .topbar-count { display: none; }
  }
</style>
</head>
<body>

  <span class="topbar-logo">SI-ONE //</span>

  <span class="topbar-count" id="counter"></span>
</div>

// Trier alphabétiquement par nom
SOFTWARE.sort((a, b) => a.name.localeCompare(b.name, 'fr'));

// Icônes SVG inline
const iconDL = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
const iconCopy = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

function render(list) {
  const main = document.getElementById('main-list');
  const empty = document.getElementById('empty');
  const counter = document.getElementById('counter');

  if (list.length === 0) {
    main.innerHTML = '';
    empty.classList.add('show');
    counter.textContent = '0 logiciel';
    return;
  }

  empty.classList.remove('show');
  counter.textContent = `${list.length} logiciel${list.length > 1 ? 's' : ''}`;

  // Grouper par catégorie (ordre d'apparition dans le tableau trié)
  const catOrder = [];
  const groups = {};
  list.forEach(s => {
    if (!groups[s.cat]) {
      groups[s.cat] = [];
      catOrder.push(s.cat);
    }
    groups[s.cat].push(s);
  });

  catOrder.sort((a, b) => a.localeCompare(b, 'fr'));

  let html = '';
  catOrder.forEach(cat => {
    html += `<div class="cat-label" data-cat="${cat}">${cat}</div>`;
    groups[cat].forEach((s, i) => {
      html += `
        <div class="dl-row" data-name="${s.name.toLowerCase()} ${s.desc.toLowerCase()} ${s.cat.toLowerCase()}">
          <span class="dl-name">${s.name}</span>
          <span class="dl-desc">${s.desc}</span>
          <a class="btn-dl" href="${s.url}" target="_blank" download>${iconDL} Télécharger</a>
          <button class="btn-copy" data-url="${s.url}" data-tip="Copier le lien" title="Copier le lien">${iconCopy}</button>
        </div>
        ${i < groups[cat].length - 1 ? '<div class="row-divider"></div>' : ''}
      `;
    });
  });

  main.innerHTML = html;

  // Copy buttons
  main.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        btn.classList.add('copied');
        btn.setAttribute('data-tip', 'Copié !');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.setAttribute('data-tip', 'Copier le lien');
        }, 1800);
      });
    });
  });
}

// Init
render(SOFTWARE);

// Search
document.getElementById('search').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) { render(SOFTWARE); return; }
  const filtered = SOFTWARE.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.desc.toLowerCase().includes(q) ||
    s.cat.toLowerCase().includes(q)
  );
  render(filtered);
});
